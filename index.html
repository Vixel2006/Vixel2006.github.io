    <script src="elm.js"></script>
    <script>
        (function () {
            var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            var app = Elm.Main.init({ node: document.getElementById("elm") });

            if (!app.ports) return;

            if (app.ports.copyCode) {
                app.ports.copyCode.subscribe(function (payload) {
                    var done = function () {
                        var btn = document.querySelector('[data-cb-id="' + payload.id + '"]');
                        if (!btn) return;
                        btn.classList.add("ok");
                        btn.textContent = "copied";
                        setTimeout(function () {
                            btn.classList.remove("ok");
                            btn.textContent = "copy";
                        }, 1200);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(payload.text).then(done, done);
                    } else {
                        done();
                    }
                });
            }

            if (app.ports.scrollToId) {
                app.ports.scrollToId.subscribe(function (id) {
                    var el = document.getElementById(id);
                    if (el) {
                        el.scrollIntoView({
                            behavior: reduceMotion ? "auto" : "smooth",
                            block: "start"
                        });
                    }
                });
            }

            if (app.ports.consoleArt) {
                app.ports.consoleArt.subscribe(function (art) {
                    console.log(art);
                    console.log("%c you found the switch. now go read a field note.",
                        "font-family: monospace; color: #a6e3a1;");
                });
            }
        })();
    </script>
